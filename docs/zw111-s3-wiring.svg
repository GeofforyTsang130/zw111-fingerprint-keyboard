<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980"><rect width="1400" height="980" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.box{fill:white;stroke:#2b6cb0;stroke-width:3;rx:16}.wire{fill:none;stroke-width:6}.title{font-size:32px;font-weight:bold}.label{font-size:24px}.note{font-size:20px}</style><text class="title" x="70" y="55">ZW111 五线接线图（功能线）</text><text class="note" x="70" y="90">五条功能线：3.3V、GND、TX、RX、TOUCH。照片中的多余线芯请以模块丝印和实测为准，不要直接接 5V。</text><rect class="box" x="70" y="140" width="360" height="330"/><text class="title" x="125" y="190">ZW111 模块</text><text class="label" x="120" y="245">红：VCC / 3.3V</text><text class="label" x="120" y="295">黑：GND</text><text class="label" x="120" y="345">黄：TX</text><text class="label" x="120" y="395">绿：RX</text><text class="label" x="120" y="445">蓝：TOUCH</text><rect class="box" x="850" y="140" width="480" height="330"/><text class="title" x="920" y="190">ESP32-S3</text><text class="label" x="900" y="245">3V3</text><text class="label" x="900" y="295">GND</text><text class="label" x="900" y="345">GPIO44（RX）</text><text class="label" x="900" y="395">GPIO43（TX）</text><text class="label" x="900" y="445">GPIO4（TOUCH）</text><path class="wire" stroke="#d33" d="M360 245 C560 245 700 245 900 245"/><path class="wire" stroke="#222" d="M300 295 C560 295 700 295 900 295"/><path class="wire" stroke="#e0b000" d="M300 345 C560 345 700 345 900 345"/><path class="wire" stroke="#168c55" d="M300 395 C560 395 700 395 900 395"/><path class="wire" stroke="#2463c4" d="M330 445 C560 445 700 445 900 445"/><text class="title" x="70" y="570">ESP32-C3</text><rect class="box" x="70" y="610" width="1260" height="250"/><text class="label" x="110" y="675">VCC → 3V3　 GND → GND　 模块 TX → GPIO20（RX）　 模块 RX → GPIO21（TX）　 TOUCH → GPIO4</text><text class="label" x="110" y="745">C3 振动输出：GPIO3 → 振动器控制端（按项目电路连接）</text><text class="note" x="110" y="805">S3 振动输出同样使用 GPIO3。串口必须交叉连接，所有设备共地。</text></svg>