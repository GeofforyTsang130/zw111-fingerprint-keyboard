<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050"><rect width="1400" height="1050" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.box{fill:white;stroke:#2b6cb0;stroke-width:3;rx:16}.wire{fill:none;stroke-width:6}.title{font-size:32px;font-weight:bold}.label{font-size:24px}.note{font-size:20px}</style><text class="title" x="60" y="55">ZW111 指纹密码输入器｜S3 / C3 通用接线图</text><text class="note" x="60" y="90">指纹模块使用五条功能线：3.3V、GND、TX、RX、TOUCH。</text><rect class="box" x="60" y="130" width="380" height="350"/><text class="title" x="115" y="185">ZW111 模块五线</text><text class="label" x="105" y="245">VCC → 3.3V</text><text class="label" x="105" y="300">GND → GND</text><text class="label" x="105" y="355">TX → 主控 RX</text><text class="label" x="105" y="410">RX → 主控 TX</text><text class="label" x="105" y="465">TOUCH → GPIO4</text><rect class="box" x="820" y="130" width="500" height="350"/><text class="title" x="885" y="185">主控引脚</text><text class="label" x="865" y="245">S3：RX GPIO44，TX GPIO43</text><text class="label" x="865" y="305">C3：RX GPIO20，TX GPIO21</text><text class="label" x="865" y="365">S3 / C3：TOUCH GPIO4</text><text class="label" x="865" y="425">S3 / C3：GND 共地</text><path class="wire" stroke="#d33" d="M360 245 C560 245 680 245 865 245"/><path class="wire" stroke="#222" d="M300 300 C560 300 680 300 865 425"/><path class="wire" stroke="#e0b000" d="M300 355 C560 355 680 355 865 245"/><path class="wire" stroke="#168c55" d="M300 410 C560 410 680 410 865 305"/><path class="wire" stroke="#2463c4" d="M330 465 C560 465 680 465 865 365"/><text class="title" x="60" y="570">振动马达模块（独立五线图之外）</text><rect class="box" x="60" y="620" width="1260" height="280"/><text class="label" x="110" y="700">VCC → 5V</text><text class="label" x="110" y="765">GND → GND（与主控共地）</text><text class="label" x="700" y="700">IN → GPIO4</text><text class="note" x="700" y="765">请以马达模块丝印为准，电源不要接到 3.3V。</text><text class="note" x="110" y="850">串口 TX/RX 必须交叉连接。S3 与 C3 的区别只有串口 GPIO 编号。</text></svg>