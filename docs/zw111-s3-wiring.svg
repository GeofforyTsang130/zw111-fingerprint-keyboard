<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#172033} .box{fill:white;stroke:#2b6cb0;stroke-width:3;rx:16} .wire{stroke:#d33;stroke-width:5;fill:none} .g{stroke:#555}.label{font-size:24px;font-weight:bold}.small{font-size:20px}</style><rect class="box" x="70" y="120" width="360" height="420"/><text class="label" x="130" y="170">ZW111 指纹模块</text><text class="small" x="120" y="240">VCC / 3.3V</text><text class="small" x="120" y="310">GND</text><text class="small" x="120" y="380">TX</text><text class="small" x="120" y="450">RX</text><rect class="box" x="770" y="120" width="360" height="420"/><text class="label" x="820" y="170">ESP32-S3 SuperMini</text><text class="small" x="850" y="240">3V3</text><text class="small" x="850" y="310">GND</text><text class="small" x="850" y="380">GPIO44 (RX)</text><text class="small" x="850" y="450">GPIO43 (TX)</text><path class="wire" d="M300 240 C520 240 650 240 850 240"/><path class="wire g" d="M300 310 C520 310 650 310 850 310"/><path class="wire" d="M300 380 C520 380 650 380 850 380"/><path class="wire" d="M300 450 C520 450 650 450 850 450"/><text class="label" x="430" y="620">交叉连接串口：模块 TX → S3 GPIO44，模块 RX → S3 GPIO43</text></svg>